name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        # numpy is required by scripts/evaluate.py; torch is optional and only
        # needed for the select_from_scores tests (they skip if it is absent).
        run: pip install pytest numpy
      - name: Run unit tests (pure-Python pieces; the full pipeline needs GPU + API keys)
        run: pytest tests/ -q
