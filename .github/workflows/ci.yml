name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pytest
      - name: Run unit tests (pure-Python pieces; the pipeline itself needs GPU + API keys)
        run: pytest tests/ -q
